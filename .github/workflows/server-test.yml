name: Server

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PocketBase
        run: |
          curl -sL "https://github.com/pocketbase/pocketbase/releases/download/v0.25.9/pocketbase_0.25.9_linux_amd64.zip" -o /tmp/pb.zip
          unzip /tmp/pb.zip -d /tmp
          chmod +x /tmp/pocketbase

      - name: Prepare data dir and superuser
        run: |
          rm -rf /tmp/capgo_ci
          mkdir -p /tmp/capgo_ci
          /tmp/pocketbase superuser upsert ci@ci.local 'ci-pass-123456789' --dir=/tmp/capgo_ci

      - name: Start PocketBase
        run: |
          /tmp/pocketbase serve --http=127.0.0.1:8090 --dir=/tmp/capgo_ci \
            --hooksDir="$GITHUB_WORKSPACE/server/pb_hooks" \
            --migrationsDir="$GITHUB_WORKSPACE/server/pb_migrations" \
            > /tmp/capgo.log 2>&1 &
          echo $! > /tmp/capgo.pid
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Server failed to start"
            cat /tmp/capgo.log
            exit 1
          fi
          echo "PocketBase is up"

      - name: Auth and upload test bundle
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8090/api/collections/_superusers/auth-with-password \
            -H "Content-Type: application/json" \
            -d '{"identity":"ci@ci.local","password":"ci-pass-123456789"}' | jq -r .token)
          echo "test bundle content" > /tmp/test.txt
          zip -j /tmp/test.zip /tmp/test.txt
          curl -sf -X POST http://127.0.0.1:8090/v1/admin/upload \
            -H "Authorization: $TOKEN" \
            -F "file=@/tmp/test.zip" \
            -F "version=0.0.1" \
            -F "app_id=test"

      - name: Check update endpoint returns bundle
        run: |
          RES=$(curl -sf -X POST http://127.0.0.1:8090/v1/updates \
            -H "Content-Type: application/json" \
            -d '{"platform":"android","device_id":"ci","app_id":"test","version_name":"0.0.0","is_emulator":false,"is_prod":true}')
          echo "$RES"
          echo "$RES" | jq -e '.version == "0.0.1"'

      - name: List bundles endpoint
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8090/api/collections/_superusers/auth-with-password \
            -H "Content-Type: application/json" \
            -d '{"identity":"ci@ci.local","password":"ci-pass-123456789"}' | jq -r .token)
          curl -sf http://127.0.0.1:8090/v1/admin/bundles -H "Authorization: $TOKEN" | jq .

      - name: Stop PocketBase
        if: always()
        run: |
          if [ -f /tmp/capgo.pid ]; then kill $(cat /tmp/capgo.pid) 2>/dev/null || true; fi
